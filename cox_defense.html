<style>
:root{--bg:#1d0b22;--ink:#fff7ef;--gold:#ffd166;--teal:#06d6a0;--pink:#ef476f;--blue:#4cc9f0;--card:#2c1236}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Inter,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,6,26,.72);z-index:10;padding:16px}
.ov.on{display:flex}
.box{background:linear-gradient(160deg,#3a1748,#251030);border:3px solid #ffd16688;border-radius:22px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:20px 20px 18px;box-shadow:0 18px 50px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.box{animation:none}}
.box h1{margin:.1rem 0 .3rem;font-size:2rem;line-height:1.1;color:var(--gold);text-shadow:0 3px 0 #7a2b52}
.box h2{margin:.2rem 0 .5rem;color:var(--gold);font-size:1.35rem}
.box p{margin:.45rem 0;line-height:1.45}
.box .small{font-size:.86rem;opacity:.85}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:.75rem 1.1rem;margin:.25rem .2rem;background:var(--teal);color:#14081a;cursor:pointer;box-shadow:0 4px 0 #04866a;font-size:1.02rem;min-height:46px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #04866a}
.btn.alt{background:#ffffff22;color:var(--ink);box-shadow:0 4px 0 #0005}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 4px 0 #a52a4a}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 #b88a1d}
.btn[disabled]{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;margin-top:.6rem}
select,input{font:inherit;font-size:1rem;padding:.6rem;border-radius:12px;border:2px solid #ffd16666;background:#14081a;color:var(--ink);width:100%;min-height:46px}
.lv{display:flex;align-items:center;gap:.6rem;background:#ffffff12;border-radius:14px;padding:.55rem .7rem;margin:.35rem 0;cursor:pointer;border:2px solid transparent}
.lv.lock{opacity:.45;cursor:default}.lv:not(.lock):hover{border-color:#ffd16688}
.lv b{font-size:1.05rem}.lv .st{margin-left:auto;color:var(--gold);font-size:1.15rem;letter-spacing:.05em;white-space:nowrap}
.num{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--pink);font-weight:900;flex:none}
.opt{display:block;width:100%;text-align:left;font:inherit;font-weight:700;background:#ffffff14;color:var(--ink);border:2px solid #ffffff22;border-radius:14px;padding:.7rem .8rem;margin:.35rem 0;cursor:pointer;min-height:46px}
.opt.ok{background:#06d6a033;border-color:var(--teal)}.opt.no{background:#ef476f33;border-color:var(--pink)}
table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{padding:.4rem .3rem;border-bottom:1px solid #ffffff1c;text-align:left}th{color:var(--gold)}
.me td{color:var(--gold);font-weight:800}
.tip{background:#06d6a018;border-left:5px solid var(--teal);border-radius:10px;padding:.55rem .75rem;margin:.6rem 0}
.logo{display:block;width:92px;height:auto;margin:0 auto .3rem;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 6px #ffffffaa) drop-shadow(0 3px 6px #0008)}
.logo.sm{width:44px;display:inline-block;margin:0 .4rem 0 0;vertical-align:middle;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 4px #fffa)}
.chars{display:flex;gap:.4rem;justify-content:center;margin:.4rem 0}
</style>

  <p class="small">Puntaje total: <b>${tot}</b></p>
  <div class="row"><button class="btn gold" data-a="rank">🏆 Ranking</button><button class="btn alt" data-a="how">¿Cómo se juega?</button><button class="btn alt" data-a="sound">${SAVE.mute ? 'Activar sonido' : 'Silenciar'}</button></div>
  <p class="small" style="text-align:center;margin-top:.8rem">${LOGO ? `<img class="logo sm" alt="" src="${LOGO}">` : ''}ESFM «Santiago de Huata» · Bioquímica · Gestión 2026</p>`);
}
function how() {
  showBox(`<h2>¿Cómo se juega?</h2><p>Los agresores bajan por el jugo gástrico hacia la <b>mucosa</b>. Toca un círculo <b>«+»</b> y elige una defensa. Cada una cuesta <b>ácido araquidónico (AA)</b>, que ganas al eliminar enemigos.</p>
  <div class="chars">${['muco', 'bica', 'flujo', 'cox1'].map(drawIcon).join('')}</div>
  <p><b>PGE₂ · Muco</b> frena · <b>Bicarbonato</b> neutraliza el ácido · <b>PGI₂ · Flujo</b> regenera la mucosa y acelera torres · <b>COX-1</b> produce AA.</p>
  <p>Toca una defensa construida para <b>mejorarla</b> o <b>retirarla</b>. Entre oleadas responde una <b>pregunta bonus</b> (+40 AA). Durante la oleada, el botón inferior cambia la velocidad.</p>
  <div class="row"><button class="btn" data-a="menu">Entendido</button></div>`);
}
function levelIntro(i) {
  newLevel(i); SCREEN = 'game'; const L = ST.L; ST.paused = true;
  showBox(`<h2>Nivel ${i + 1}: ${L.name}</h2><p class="small">Tema del expositor: ${L.tema}</p><div class="tip">${L.intro}</div><div class="chars">${L.towers.map(drawIcon).join('')}</div><div class="row"><button class="btn" data-a="resume">¡A defender!</button></div>`);
}
function towerMenu(tw) {
  const T = TOWERS[tw.k], up = Math.round(T.cost * 0.8 * tw.lvl), can = tw.lvl < 3 && ST.aa >= up, refund = Math.round(T.cost * 0.6 * tw.lvl); ST.paused = true;
  showBox(`<h2>${T.n} · nivel ${tw.lvl}</h2><div class="chars">${drawIcon(tw.k)}</div><p>${T.info}</p><div class="row">${tw.lvl < 3 ? `<button class="btn gold" data-a="up" ${can ? '' : 'disabled'}>Mejorar · ${up} AA</button>` : '<span class="small">Nivel máximo</span>'}<button class="btn pink" data-a="sell">Retirar · +${refund} AA</button><button class="btn alt" data-a="resume">Cerrar</button></div>`);
  popup = { tw };
}
function buildMenu(pad) {
  popup = { pad }; ST.paused = true;
  showBox(`<h2>Construir defensa</h2>${ST.L.towers.map(k => { const T = TOWERS[k], can = ST.aa >= T.cost; return `<button class="opt" data-b="${k}" ${can ? '' : 'disabled'} style="display:flex;align-items:center;gap:.6rem">${drawIcon(k)}<span><b>${T.n}</b> · ${T.cost} AA<br><span class="small">${T.info}</span></span></button>`; }).join('')}<div class="row"><button class="btn alt" data-a="resume">Cancelar</button></div>`);
}

box.addEventListener('click', e => {
  SND.init(); const t = e.target.closest('[data-a],[data-q],[data-b]'); if (!t || t.disabled) return; const a = t.dataset.a;
  if (t.dataset.q) { answerQuiz(+t.dataset.q, +t.dataset.o, t); return; }
  if (t.dataset.b) { const k = t.dataset.b, T = TOWERS[k], p = PADS[popup.pad]; if (ST.aa < T.cost) return; ST.aa -= T.cost; ST.towers.push({ k, pad: popup.pad, x: p[0], y: p[1], lvl: 1, cd: 0, block: 0, look: 0 }); SND.build(); burst(p[0], p[1], T.col, 14); popup = null; hideBox(); ST.paused = false; return; }
  if (a === 'level') { const who = document.getElementById('who'); if (who) { if (!who.value) { who.focus(); who.style.borderColor = '#ef476f'; return; } SAVE.name = who.value; LS.set('save', SAVE); } levelIntro(+t.dataset.l); SND.music(SAVE.music && !SAVE.mute); return; }
  if (a === 'resume') { hideBox(); popup = null; if (ST) ST.paused = false; return; }
  if (a === 'menu') { menu(); return; }
  if (a === 'how') { how(); return; }
  if (a === 'rank' || a === 'final') { const who = document.getElementById('who'); if (who && who.value) { SAVE.name = who.value; LS.set('save', SAVE); } showRanking(); return; }
  if (a === 'sound') { SND.setMute(!SAVE.mute); menu(); return; }
  if (a === 'up') { const tw = popup.tw, T = TOWERS[tw.k], up = Math.round(T.cost * 0.8 * tw.lvl); if (ST.aa >= up && tw.lvl < 3) { ST.aa -= up; tw.lvl++; SND.build(); burst(tw.x, tw.y, '#ffd166', 16); } hideBox(); popup = null; ST.paused = false; return; }
  if (a === 'sell') { const tw = popup.tw, T = TOWERS[tw.k]; ST.aa += Math.round(T.cost * 0.6 * tw.lvl); ST.towers = ST.towers.filter(x => x !== tw); SND.coin(); hideBox(); popup = null; ST.paused = false; return; }
});
box.addEventListener('change', e => { if (e.target.id === 'who') { SAVE.name = e.target.value; LS.set('save', SAVE); e.target.style.borderColor = ''; } });

/* ---------------- entrada en el lienzo ---------------- */
const inR = (p, r) => r && p[0] >= r[0] && p[0] <= r[0] + r[2] && p[1] >= r[1] && p[1] <= r[1] + r[3];
cv.addEventListener('pointerdown', e => {
  SND.init(); if (!ST || ov.classList.contains('on')) return; const r = cv.getBoundingClientRect(), p = [(e.clientX - r.left) / SC, (e.clientY - r.top) / SC];
  if (inR(p, BTN.pause)) { ST.paused = !ST.paused; return; }
  if (inR(p, BTN.mute)) { SND.setMute(!SAVE.mute); SND.music(!SAVE.mute && SAVE.music); return; }
  if (ST.paused || ST.over) return;
  if (inR(p, BTN.wave)) { if (!ST.running) startWave(); else { ST.speed = ST.speed > 1 ? 1 : 2; } return; }
  if (inR(p, BTN.miso)) { useMiso(); return; }
  for (const b of BTN.shop || []) if (inR(p, b)) { sel = sel === b[4] ? null : b[4]; return; }
  const tw = ST.towers.find(x => Math.hypot(x.x - p[0], x.y - p[1]) < 40); if (tw) { towerMenu(tw); return; }
  const pi = PADS.findIndex((q, i) => Math.hypot(q[0] - p[0], q[1] - p[1]) < 40 && !ST.towers.some(x => x.pad === i));
  if (pi >= 0) { if (sel && ST.aa >= TOWERS[sel].cost) { const T = TOWERS[sel], q = PADS[pi]; ST.aa -= T.cost; ST.towers.push({ k: sel, pad: pi, x: q[0], y: q[1], lvl: 1, cd: 0, block: 0, look: 0 }); SND.build(); burst(q[0], q[1], T.col, 14); if (ST.aa < T.cost) sel = null; } else buildMenu(pi); }
});
addEventListener('keydown', e => { if (e.key === ' ' && ST && !ov.classList.contains('on')) { e.preventDefault(); if (!ST.running) startWave(); } if (e.key === 'p' && ST) ST.paused = !ST.paused; });
document.addEventListener('visibilitychange', () => { if (document.hidden && ST && !ST.over) { ST.paused = true; } });

/* ---------------- bucle principal ---------------- */
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = (now - T0) / 1000;
  update(dt);
  g.setTransform(SC * DPR, 0, 0, SC * DPR, 0, 0);
  if (ST) {
    drawField(t);
    const objs = ST.towers.map(o => ['t', o]).concat(ST.enemies.map(o => ['e', o])).sort((a, b) => a[1].y - b[1].y);
    for (const [k, o] of objs) k === 't' ? drawTower(o, t) : drawEnemy(o, t);
    for (const s of ST.shots) { g.fillStyle = s.k === 'bica' ? '#7cc6ff' : '#d9fff4'; g.beginPath(); g.arc(s.x, s.y, s.k === 'bica' ? 10 : 8, 0, 7); g.fill(); g.strokeStyle = 'rgba(20,6,26,.5)'; g.lineWidth = 2; g.stroke(); }
    for (const p of ST.parts) { g.globalAlpha = 1 - p.t / p.life; g.fillStyle = p.col; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); } g.globalAlpha = 1;
    for (const f of ST.floats) { g.globalAlpha = Math.max(0, 1 - f.t / 1.3); text(f.s, f.x, f.y, f.size, f.col); } g.globalAlpha = 1;
    if (ST.misoT > 0) { g.fillStyle = 'rgba(255,143,163,0.12)'; g.fillRect(0, FIELD_TOP, W, FIELD_BOT - FIELD_TOP); }
    drawHUD(t);
    if (ST.paused && !ov.classList.contains('on')) { g.fillStyle = 'rgba(20,6,26,.6)'; g.fillRect(0, FIELD_TOP, W, FIELD_BOT - FIELD_TOP); text('Pausa', W / 2, 560, 54, '#ffd166'); text('toca ▶ para continuar', W / 2, 620, 22); }
  } else {
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#2a0f2e'); gr.addColorStop(1, '#5a1f4a'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
  requestAnimationFrame(frame);
}
menu(); requestAnimationFrame(frame);
window.__COXD = { get ST() { return ST; }, update, askQuiz, startWave, newLevel, levelIntro, LEVELS, TOWERS, SAVE: () => SAVE };
</script>
