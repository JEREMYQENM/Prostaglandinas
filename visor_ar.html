<style>
:root{--ink:#14263a;--mute:#5b6b7c;--brand:#163a5a;--teal:#0d9aa3;--gold:#f2b632;--line:#d9e2ec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:Inter,"Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#fff}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
#ui > *{pointer-events:auto}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:linear-gradient(#ffffffee,#ffffffcc);border-bottom:1px solid var(--line)}
.ar .top{background:linear-gradient(#0f2a44dd,#0f2a4499);border:0;color:#fff}
.brand{display:flex;align-items:center;gap:.45rem;font-weight:800;font-size:.95rem;margin-right:auto}
.brand img{width:30px;height:30px;border-radius:6px;background:#fff;object-fit:contain}
select{font:inherit;font-size:.95rem;padding:.45rem .5rem;border-radius:10px;border:1px solid var(--line);max-width:60vw;min-height:40px;background:#fff;color:var(--ink)}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:.45rem .65rem;min-height:40px;min-width:40px;cursor:pointer}
.btn.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.ar{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.big{font-size:1.05rem;padding:.65rem 1rem}
.bottom{padding:8px 10px calc(env(safe-area-inset-bottom) + 10px)}
.bubble{position:relative;background:#fff;border:2px solid var(--teal);border-radius:16px;padding:.7rem .85rem .6rem;box-shadow:0 8px 24px rgba(15,42,68,.18);max-width:640px;margin:0 auto;font-size:.98rem;line-height:1.45;max-height:34vh;overflow:auto}
.bubble b.who{color:var(--teal)}
.bubble .row{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.45rem}
.hint{text-align:center;font-weight:700;color:#fff;text-shadow:0 1px 3px #000a;margin:.4rem 0;font-size:.95rem}
.lay{display:flex;gap:.35rem;flex-wrap:wrap}
.legend{display:flex;gap:.6rem;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin-top:.35rem}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:1px solid #0002}
.hidden{display:none!important}
#lbl{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
#lbl span{position:absolute;transform:translate(-50%,-50%);font:700 11px/1 Inter,system-ui,sans-serif;color:#0b2a40;background:#ffffffd9;border:1px solid #0b2a4055;border-radius:6px;padding:1px 4px;white-space:nowrap}
#lbl span.o{color:#b02a1f}#lbl span.n{color:#1f4fa0}
.opts{background:#fff;border:2px solid var(--teal);border-radius:16px;padding:.55rem .7rem;max-width:640px;margin:0 auto;max-height:38vh;overflow:auto;box-shadow:0 8px 24px rgba(15,42,68,.18)}
.opts h4{margin:.45rem 0 .25rem;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.opts h4:first-child{margin-top:0}
.seg{display:flex;flex-wrap:wrap;gap:.3rem}
.seg .btn{min-height:36px;padding:.3rem .55rem;font-size:.86rem}
.opts label.rg{display:flex;align-items:center;gap:.5rem;font-size:.85rem;margin:.2rem 0}.opts label.rg input{flex:1;min-width:0}
.opts .leg2{display:flex;flex-wrap:wrap;gap:.3rem .7rem;font-size:.82rem;margin-top:.35rem}
.opts .leg2 i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-2px;border:1px solid #0003}
.card2d{position:fixed;right:8px;top:calc(env(safe-area-inset-top) + 108px);width:min(46vw,300px);background:#fff;border:2px solid var(--teal);border-radius:12px;padding:4px;box-shadow:0 6px 20px rgba(15,42,68,.25);z-index:3}
.card2d svg{width:100%;height:auto;display:block}
.card2d .x{position:absolute;right:2px;top:2px;min-height:28px;min-width:28px;padding:0}
#err{position:fixed;inset:auto 10px 10px 10px;background:#b03a2e;color:#fff;padding:.6rem;border-radius:10px;display:none;z-index:9}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="lbl"></div>

  document.querySelectorAll('#segRep .btn').forEach(x => x.classList.toggle('on', x.dataset.rep === 'bs')); document.querySelectorAll('#segLab .btn').forEach(x => x.classList.toggle('on', x.dataset.lab === 'none')); setHlMode('none'); };
// los toques en los controles no deben contar como «toque en la escena» en AR
['ui'].forEach(id => $(id).addEventListener('beforexrselect', e => { if (e.target.closest('button,select,.bubble,.opts,.card2d,input')) e.preventDefault(); }));

/* ======================= realidad aumentada (WebXR, Android) ======================= */
async function checkAR() {
  if (!navigator.xr || !navigator.xr.isSessionSupported) return false;
  try { return await navigator.xr.isSessionSupported('immersive-ar'); } catch (e) { return false; }
}
checkAR().then(ok => { if (ok) { $('arBtn').classList.remove('hidden'); say(intro(MOL.d) + '<div class="legend"><b>Tu teléfono permite AR:</b> toca «Ver en AR» para colocar la molécula sobre una mesa.</div>'); } });
$('arBtn').onclick = startAR; $('exitBtn').onclick = () => XR && XR.end();
async function startAR() {
  try {
    const s = await navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['hit-test', 'local'], optionalFeatures: ['dom-overlay'], domOverlay: { root: $('ui') } });
    XR = s; document.body.classList.add('ar'); $('arBtn').classList.add('hidden'); $('exitBtn').classList.remove('hidden'); $('arHint').classList.remove('hidden'); $('gyroBtn').classList.add('hidden');
    AR.placed = false; AR.ret = null; AR.scale = 1; setAuto(true);
    if (gl.makeXRCompatible) await gl.makeXRCompatible();
    s.updateRenderState({ baseLayer: new XRWebGLLayer(s, gl, { alpha: true, antialias: true }) });
    const ref = await s.requestReferenceSpace('local'), viewer = await s.requestReferenceSpace('viewer'), hitSrc = await s.requestHitTestSource({ space: viewer });
    let lastT = performance.now();
    s.addEventListener('select', ev => {
      if (!AR.placed) { if (AR.ret) { AR.anchor = AR.ret; AR.placed = true; $('arHint').classList.add('hidden'); say(intro(MOL.d)); } return; }
      const pose = ev.frame.getPose(ev.inputSource.targetRaySpace, ref); if (!pose) return; const m = pose.transform.matrix, o = [m[12], m[13], m[14]], d = norm([-m[8], -m[9], -m[10]]); pickRay(o, d);
    });
    s.addEventListener('end', () => { XR = null; hitSrc && hitSrc.cancel && hitSrc.cancel(); document.body.classList.remove('ar'); $('arBtn').classList.remove('hidden'); $('exitBtn').classList.add('hidden'); $('arHint').classList.add('hidden'); $('gyroBtn').classList.remove('hidden'); requestAnimationFrame(loop); });
    const onFrame = (time, frame) => {
      const sess = frame.session; sess.requestAnimationFrame(onFrame); const now = performance.now(), dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; if (VIEW.auto) VIEW.spin += dt * 0.35;
      const pose = frame.getViewerPose(ref); const layer = sess.renderState.baseLayer; gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      if (!AR.placed) { const hits = frame.getHitTestResults(hitSrc), hp = hits.length ? hits[0].getPose(ref) : null; AR.ret = hp ? new Float32Array(hp.transform.matrix) : null; }
      if (!pose) return;
      for (const view of pose.views) { const vp = layer.getViewport(view); gl.viewport(vp.x, vp.y, vp.width, vp.height); const cm = view.transform.matrix; render(view.projectionMatrix, view.transform.inverse.matrix, [cm[12], cm[13], cm[14]], now / 1000); }
    };
    s.requestAnimationFrame(onFrame);
  } catch (e) { XR = null; errBox.style.display = 'block'; errBox.textContent = 'No se pudo iniciar la realidad aumentada: ' + (e && e.message ? e.message : e) + '. Revisa que tengas Chrome y los «Servicios de Google Play para AR» actualizados.'; setTimeout(() => errBox.style.display = 'none', 7000); }
}

/* ======================= inicio ======================= */
const first = (location.hash || '').slice(1); sel.value = DATA.some(d => d.id === first) ? first : 'PGE2'; setMol(sel.value);
requestAnimationFrame(loop);
window.__AR = { setHlMode, selectBond, VIEW, MOL: () => MOL, selectAtom, nextFact, pickRay };
</script>
